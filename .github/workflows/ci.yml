# CI — jaga kualitas kode di tiap push/PR.
# Gate wajib: type check (tsc) + ESLint + production build.
# Baseline lint saat ini 0 error dan 0 warning (CLAUDE.md §5) — jangan menambah
# keduanya. Build berjalan mode mock karena CI tidak memegang secret.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npm run build
        env:
          # CI tidak punya secret Supabase/OpenAI — build dalam mode mock.
          NEXT_PUBLIC_USE_MOCK: "true"
