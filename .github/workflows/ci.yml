# CI — jaga kualitas kode di tiap push/PR.
# Gate wajib: type check (tsc) + ESLint (0 error) + production build.
# Catatan: ESLint masih melaporkan beberapa WARNING (img, exhaustive-deps) yang
# tidak menggagalkan build (eslint exit 0 selama tak ada error).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npm run build
        env:
          # CI tidak punya secret Supabase/OpenAI — build dalam mode mock.
          NEXT_PUBLIC_USE_MOCK: "true"
